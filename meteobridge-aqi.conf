# Meteobridge AQI v2.0.0 configuration

# PURPLEAIR INPUT
# PurpleAir sensor's reserved LAN address. The plugin reads the sensor directly
# and never calls Meteobridge template.cgi.
PURPLEAIR_URL="http://192.168.100.1/json"
# atm is appropriate for an outdoor PurpleAir. cf1 is available when needed.
PM25_SOURCE="atm"               # atm or cf1; channels A and B are averaged
MAX_SENSOR_AGE=300              # reject a frozen response after this many seconds
HTTP_TIMEOUT=10

# AQI CALCULATION
AQI_STANDARD="EPA_2024"
AQI_MODE="both"                 # instant, nowcast, or both
AQI_CAP=500                     # cap public-facing AQI at 500; 999 is also valid
CATEGORY_SOURCE="nowcast"       # instant or nowcast

# PURPLEAIR CORRECTION
# none: use the Meteobridge PM2.5 value unchanged
# epa_us: EPA U.S.-wide PurpleAir CF=1 correction; requires relative humidity
PURPLEAIR_CORRECTION="none"
CORRECTION_MISSING_RH="reject"  # reject or uncorrected

# EPA NOWCAST
NOWCAST_ENABLED="yes"
NOWCAST_HOURS=12
NOWCAST_MIN_RECENT=2
NOWCAST_REQUIRE_CURRENT="no"
MIN_HOURLY_COVERAGE=75

# PLUGIN OUTPUT SENSORS
# These are sensors belonging to the User-Defined Plugin station. If this
# plugin is Station 2, data0num is addressed in templates as data2!0num.
OUTPUT_INSTANT_AQI="data0"
OUTPUT_NOWCAST_AQI="data1"
OUTPUT_CATEGORY="data2"
OUTPUT_PM25="data3"
OUTPUT_NOWCAST_PM25="data4"
OUTPUT_STATUS="data5"          # 0 OK, 1 source error, 2 RH error, 3 configuration error

# OPERATION
# PurpleAir /json is a two-minute average, so polling every 120 seconds avoids
# duplicate samples and unnecessary process/network activity.
UPDATE_SECONDS=120
LOG_LEVEL="info"                # error, warn, info, or debug
# Blank means a "meteobridge-aqi-state" directory beside the plugin.
STATE_DIR=""
LOG_MAX_KB=256
